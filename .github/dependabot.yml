version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      next-and-react:
        patterns:
          ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      testing-and-quality:
        patterns:
          ["eslint", "eslint-config-next", "prettier", "typescript", "vitest"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
