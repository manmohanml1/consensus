name: Bug report
description: Report reproducible incorrect behavior without sensitive data.
title: "fix(scope): "
labels: ["type:bug", "status:triage"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove room codes, capabilities, location, names, votes, and provider secrets.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and recovery
    validations:
      required: true
