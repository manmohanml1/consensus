name: Consensus Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:[[:space:]].+ ]]; then
            echo "Use a Conventional Commit pull-request title."
            exit 1
          fi
      - name: Validate topic branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feat|fix|docs|refactor|perf|test|build|ci|chore|release|codex)/[a-z0-9][a-z0-9._-]*$ ]] && \
             [[ ! "$HEAD_REF" =~ ^dependabot/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "Use an approved lowercase topic branch."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chromium
        run: pnpm --filter @consensus/web exec playwright install --with-deps chromium
      - name: Reject high or critical production advisories
        run: pnpm audit --prod --audit-level high
      - name: Verify source
        run: pnpm verify
      - name: Upload immutable application artifact
        uses: actions/upload-artifact@v7
        with:
          name: consensus-web-${{ github.sha }}
          path: apps/web/.next
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  build-and-test:
    name: build-and-test
    if: always()
    needs: [pull-request-policy, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce aggregate merge gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          POLICY_RESULT: ${{ needs.pull-request-policy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          if [[ "$EVENT_NAME" = "pull_request" ]]; then
            test "$POLICY_RESULT" = "success"
          else
            test "$POLICY_RESULT" = "skipped"
          fi
