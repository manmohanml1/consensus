name: Consensus Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: Immutable Consensus Vercel Preview URL for the acceptance test
        required: false
        type: string
      synthetic_title:
        description: Unique non-sensitive title used only for the synthetic room cleanup query
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:[[:space:]].+ ]]; then
            echo "Use a Conventional Commit pull-request title."
            exit 1
          fi
      - name: Validate Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          invalid=0
          while IFS=$'\t' read -r commit subject; do
            parents="$(git show -s --format=%P "$commit")"
            if [[ "$parents" == *" "* ]]; then
              echo "Allowing merge commit subject: $subject"
              continue
            fi
            if [[ ! "$subject" =~ ^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?:[[:space:]].+ ]]; then
              echo "Invalid Conventional Commit subject: $subject"
              invalid=1
            fi
          done < <(git log --format='%H%x09%s' "$BASE_SHA..$HEAD_SHA")
          test "$invalid" = "0"
      - name: Validate topic branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^(feat|fix|docs|refactor|perf|test|build|ci|chore|release|codex)/[a-z0-9][a-z0-9._-]*$ ]] && \
             [[ ! "$HEAD_REF" =~ ^dependabot/[a-z0-9][a-z0-9._/-]*$ ]]; then
            echo "Use an approved lowercase topic branch."
            exit 1
          fi

  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chromium
        run: pnpm --filter @consensus/web exec playwright install --with-deps chromium
      - name: Reject high or critical production advisories
        run: pnpm audit --prod --audit-level high
      - name: Verify source
        run: pnpm verify
      - name: Upload immutable application artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consensus-web-${{ github.sha }}
          path: apps/web/.next
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  persistence:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:8810a63e526404041442acb4d96b8d882dffd544df9c43f2ea59deac2004628f
        env:
          POSTGRES_DB: consensus_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d consensus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify migrations on disposable PostgreSQL
        env:
          CONSENSUS_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/consensus_test
        run: pnpm test:persistence
      - name: Rehearse disposable backup, restore, and teardown
        env:
          CONSENSUS_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/consensus_test
          CONSENSUS_RECOVERY_REHEARSAL: "true"
        run: pnpm --filter @consensus/persistence test:recovery

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          show-openssf-scorecard: true
          show-patched-versions: true

  build-and-test:
    name: build-and-test
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [pull-request-policy, verify, persistence, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce aggregate merge gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          POLICY_RESULT: ${{ needs.pull-request-policy.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PERSISTENCE_RESULT: ${{ needs.persistence.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$PERSISTENCE_RESULT" = "success"
          if [[ "$EVENT_NAME" = "pull_request" ]]; then
            test "$POLICY_RESULT" = "success"
            test "$DEPENDENCY_RESULT" = "success"
          else
            test "$POLICY_RESULT" = "skipped"
            test "$DEPENDENCY_RESULT" = "skipped"
          fi

  protected-preview-acceptance:
    if: github.event_name == 'workflow_dispatch' && inputs.preview_url != '' && inputs.synthetic_title != ''
    environment: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Validate approved Preview target and synthetic title
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          SYNTHETIC_TITLE: ${{ inputs.synthetic_title }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
            if ! [[ "$PREVIEW_URL" =~ ^https://consensus-[a-z0-9]+-manmohanlonawat-8572s-projects\.vercel\.app/?$ ]]; then
              echo "Preview URL is not an approved Consensus Vercel deployment."
              exit 1
            fi
          [[ "$SYNTHETIC_TITLE" =~ ^Preview\ acceptance\ [A-Za-z0-9._:-]{1,80}$ ]]
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chromium
        run: pnpm --filter @consensus/web exec playwright install --with-deps chromium
      - name: Exercise protected Preview with isolated host and participant browsers
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.preview_url }}
          CONSENSUS_LIVE_PREVIEW_ACCEPTANCE: "1"
          CONSENSUS_PREVIEW_TEST_TITLE: ${{ inputs.synthetic_title }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter @consensus/web exec playwright test e2e/preview-room-acceptance.spec.ts --project=desktop-chromium --retries=0
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-acceptance-diagnostics-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
