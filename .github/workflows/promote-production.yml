name: Consensus Production Promotion

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Exact READY Vercel deployment URL built from current main
        required: true
        type: string
      expected_commit:
        description: Full 40-character main commit SHA represented by the deployment
        required: true
        type: string
      production_url:
        description: Production vercel.app URL to smoke-check after promotion
        required: true
        default: https://consensus-web-navy.vercel.app
        type: string
      confirmation:
        description: Type PROMOTE to authorize this exact production promotion
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: consensus-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ inputs.production_url }}
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Validate owner-supplied promotion target
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PRODUCTION_URL: ${{ inputs.production_url }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "PROMOTE"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOYMENT_URL" =~ ^https://[a-z0-9][a-z0-9.-]*\.vercel\.app/?$ ]]
          [[ "$PRODUCTION_URL" =~ ^https://[a-z0-9][a-z0-9.-]*\.vercel\.app/?$ ]]
          test "$(git rev-parse origin/main)" = "$EXPECTED_COMMIT"

          deployment_host="${DEPLOYMENT_URL#https://}"
          deployment_host="${deployment_host%/}"
          echo "deployment_host=$deployment_host" >> "$GITHUB_ENV"
      - name: Verify staged Production deployment ownership, state, branch, and commit
        id: deployment
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          VERCEL_SCOPE_ID: ${{ secrets.VERCEL_ORG_ID || secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_PROJECT_ID"
          [[ "$VERCEL_PROJECT_ID" =~ ^prj_[A-Za-z0-9]+$ ]]

          deployment_api_url="https://api.vercel.com/v13/deployments/$deployment_host"
          if [ -n "$VERCEL_SCOPE_ID" ]; then
            [[ "$VERCEL_SCOPE_ID" =~ ^team_[A-Za-z0-9]+$ ]]
            encoded_scope_id="$(jq --raw-output --null-input --arg value "$VERCEL_SCOPE_ID" '$value | @uri')"
            deployment_api_url="$deployment_api_url?teamId=$encoded_scope_id"
          fi

          curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "$deployment_api_url" \
            --output deployment.json

          jq --exit-status --arg project "$VERCEL_PROJECT_ID" '.projectId == $project' deployment.json
          jq --exit-status --arg commit "$EXPECTED_COMMIT" '.meta.githubCommitSha == $commit' deployment.json
          jq --exit-status '.meta.githubCommitRef == "main"' deployment.json
          jq --exit-status '.target == "production"' deployment.json
          jq --exit-status '.readyState == "READY"' deployment.json

          deployment_id="$(jq --raw-output '.id' deployment.json)"
          [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
      - name: Promote the verified deployment without rebuilding
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          VERCEL_SCOPE_ID: ${{ secrets.VERCEL_ORG_ID || secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          promotion_api_url="https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEPLOYMENT_ID"
          if [ -n "$VERCEL_SCOPE_ID" ]; then
            [[ "$VERCEL_SCOPE_ID" =~ ^team_[A-Za-z0-9]+$ ]]
            encoded_scope_id="$(jq --raw-output --null-input --arg value "$VERCEL_SCOPE_ID" '$value | @uri')"
            promotion_api_url="$promotion_api_url?teamId=$encoded_scope_id"
          fi

          promotion_status="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header "Content-Type: application/json" \
            "$promotion_api_url" \
            --output promotion.json \
            --write-out '%{http_code}')"
          [[ "$promotion_status" =~ ^2[0-9]{2}$ ]]
          if [ -s promotion.json ]; then
            jq --exit-status . promotion.json > /dev/null
          fi
      - name: Verify the Production alias points to the exact deployment
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PRODUCTION_URL: ${{ inputs.production_url }}
          VERCEL_SCOPE_ID: ${{ secrets.VERCEL_ORG_ID || secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          production_host="${PRODUCTION_URL#https://}"
          production_host="${production_host%/}"
          deployment_api_url="https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID"
          if [ -n "$VERCEL_SCOPE_ID" ]; then
            encoded_scope_id="$(jq --raw-output --null-input --arg value "$VERCEL_SCOPE_ID" '$value | @uri')"
            deployment_api_url="$deployment_api_url?teamId=$encoded_scope_id"
          fi

          alias_verified=false
          for attempt in {1..10}; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              "$deployment_api_url" \
              --output promoted-deployment.json

            jq --exit-status --arg project "$VERCEL_PROJECT_ID" '.projectId == $project' promoted-deployment.json
            jq --exit-status --arg commit "$EXPECTED_COMMIT" '.meta.githubCommitSha == $commit' promoted-deployment.json
            jq --exit-status '.target == "production" and .readyState == "READY"' promoted-deployment.json
            if jq --exit-status --arg host "$production_host" '(.alias // []) | index($host) != null' promoted-deployment.json; then
              alias_verified=true
              break
            fi
            sleep 3
          done
          test "$alias_verified" = "true"
      - name: Smoke-check Production
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          PRODUCTION_URL: ${{ inputs.production_url }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 2 \
            "$PRODUCTION_URL" \
            --output /dev/null
          {
            echo "Promoted $deployment_host for $EXPECTED_COMMIT"
            echo "Verified deployment ID: ${{ steps.deployment.outputs.deployment_id }}"
            echo "Verified Production URL: $PRODUCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
