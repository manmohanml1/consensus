name: Consensus Release Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-preview.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Verify annotated tag and versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag" || { echo "Release tags must be annotated."; exit 1; }
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$release_commit" origin/main
          pnpm release:check -- --tag "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify
      - name: Package immutable application artifact
        run: tar -czf "consensus-web-${GITHUB_REF_NAME}.tar.gz" -C apps/web .next
      - name: Generate release checksum
        run: sha256sum "consensus-web-${GITHUB_REF_NAME}.tar.gz" > "consensus-web-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: consensus-web-${{ github.ref_name }}.tar.gz
      - name: Retain verified release candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consensus-release-candidate-${{ github.ref_name }}
          path: |
            consensus-web-${{ github.ref_name }}.tar.gz
            consensus-web-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
