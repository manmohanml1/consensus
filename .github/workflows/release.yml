name: Consensus Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Verify annotated tag and versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag" || { echo "Release tags must be annotated."; exit 1; }
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$release_commit" origin/main
          expected="${RELEASE_TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$expected"
          test "$(node -p "require('./apps/web/package.json').version")" = "$expected"
          test "$(node -p "require('./packages/domain/package.json').version")" = "$expected"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify
      - name: Package immutable application artifact
        run: tar -czf "consensus-web-${GITHUB_REF_NAME}.tar.gz" -C apps/web .next
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "consensus-web-${GITHUB_REF_NAME}.tar.gz" --verify-tag --title "Consensus ${GITHUB_REF_NAME}" --generate-notes
