name: Consensus Preview Acceptance

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Immutable Consensus Vercel Preview URL for this exact branch commit
        required: true
        type: string
      synthetic_title:
        description: Unique non-sensitive title used only for the synthetic room cleanup query
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-acceptance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  protected-preview:
    environment: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Validate approved Preview target and synthetic title
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          SYNTHETIC_TITLE: ${{ inputs.synthetic_title }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          case "$PREVIEW_URL" in
            https://consensus-web-*-manmohanlonawat-8572s-projects.vercel.app|https://consensus-web-*-manmohanlonawat-8572s-projects.vercel.app/)
              ;;
            *)
              echo "Preview URL is not an approved Consensus Vercel deployment."
              exit 1
              ;;
          esac
          [[ "$SYNTHETIC_TITLE" =~ ^Preview\ acceptance\ [A-Za-z0-9._:-]{1,80}$ ]]
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Playwright Chromium
        run: pnpm --filter @consensus/web exec playwright install --with-deps chromium
      - name: Exercise protected Preview with isolated host and participant browsers
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.preview_url }}
          CONSENSUS_LIVE_PREVIEW_ACCEPTANCE: "1"
          CONSENSUS_PREVIEW_TEST_TITLE: ${{ inputs.synthetic_title }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm --filter @consensus/web test:e2e -- e2e/preview-room-acceptance.spec.ts --project=desktop-chromium
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-acceptance-diagnostics-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
